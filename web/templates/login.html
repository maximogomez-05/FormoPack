<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema — FormoPack</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0a192f 0%, #004481 60%, #0a2a4a 100%);
    }
    .login-card {
      background: #fff;
      border-radius: 12px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }
    .login-logo { text-align: center; margin-bottom: 32px; }
    .login-logo-icon { font-size: 44px; color: var(--primary); }
    .login-logo-name { font-size: 22px; font-weight: 800; margin-top: 12px; color: var(--text-main); letter-spacing: 0.5px; }
    .login-logo-sub { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; margin-top: 4px; }
    .login-divider { border:none; border-top:1px solid var(--border); margin: 24px 0; }
    .login-footer { text-align:center; margin-top:24px; font-size:12px; color:var(--text-muted); }
    .login-footer a { color: var(--primary); text-decoration:none; }
    .login-footer a:hover { text-decoration:underline; }
  </style>
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <i class="fa-solid fa-cube login-logo-icon"></i>
      <div class="login-logo-name">FormoPack</div>
      <div class="login-logo-sub">Plataforma Logística</div>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }}" style="font-size:13px; padding:10px;">
            <i class="fa-solid {% if cat == 'success' %}fa-check-circle{% elif cat == 'danger' %}fa-circle-xmark{% else %}fa-info-circle{% endif %}"></i>
            <span>{{ msg }}</span>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.login') }}" autocomplete="off">
      <div class="form-group">
        <label class="form-label">Correo Institucional</label>
        <input type="email" name="email" class="form-control" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <input type="password" name="password" class="form-control" required>
      </div>

      <button type="submit" class="btn btn-primary w-100 mt-2" style="padding:12px;">
        Ingresar al Sistema <i class="fa-solid fa-arrow-right" style="margin-left:8px;"></i>
      </button>
    </form>

    <hr class="login-divider">
    <div class="login-footer">
      <i class="fa-solid fa-magnifying-glass"></i>
      <a href="{{ url_for('admin.tracking_publico') }}">Consultar estado de un envío</a>
      <br><br>
      <span>FormoPack Express &copy; <span id="yr"></span></span>
    </div>
  </div>
</div>
<script>document.getElementById('yr').textContent = new Date().getFullYear();</script>
</body>
</html>
