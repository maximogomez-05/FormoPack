{% extends "base.html" %}
{% block title %}Nuevo Cliente{% endblock %}
{% block page_title %}➕ Registrar Cliente{% endblock %}
{% block content %}
<div style="max-width:500px;">
  <div class="card">
    <form method="POST">
      <div class="form-group">
        <label class="form-label">DNI *</label>
        <input type="text" name="dni" class="form-control" placeholder="Ej: 30123456" required maxlength="15">
      </div>
      <div class="form-group">
        <label class="form-label">Nombre Completo *</label>
        <input type="text" name="nombre_completo" class="form-control" placeholder="Nombre y Apellido" required>
      </div>
      <div class="form-group">
        <label class="form-label">Teléfono *</label>
        <input type="text" name="telefono" class="form-control" placeholder="3704 XXXXXX" required>
      </div>
      <div style="display:flex;gap:12px;margin-top:8px;">
        <a href="{{ url_for('recepcion.listar_clientes') }}" class="btn btn-secondary">← Volver</a>
        <button type="submit" class="btn btn-primary">✅ Registrar</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
